name: Testes da API bancária

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: pytest da API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      kafka:
        image: apache/kafka:4.1.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: banking-ci
          POSTGRES_DB: banking_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U banking -d banking_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            banking_api/requirements.txt
            banking_api/requirements-test.txt

      - name: Instalar dependências
        id: dependencias
        run: python -m pip install -r banking_api/requirements-test.txt

      - name: Executar testes da API
        id: pytest
        env:
          BANKING_TEST_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          BANKING_TEST_DATABASE_URL: postgresql://banking:banking-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/banking_test
        run: python -m pytest banking_api/tests -q --junitxml=reports/banking-api-junit.xml

      - name: Publicar relatório JUnit
        if: ${{ !cancelled() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: banking-api-junit
          path: reports/banking-api-junit.xml
          if-no-files-found: error

      - name: Medir performance da API HTTP
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        id: performance
        env:
          BANKING_TEST_DATABASE_URL: postgresql://banking:banking-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/banking_test
        run: python -m pytest banking_api/tests/performance_api.py -q -s --junitxml=reports/banking-api-performance.xml

      - name: Publicar evidências de performance
        if: ${{ !cancelled() && (steps.performance.outcome == 'success' || steps.performance.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: banking-api-performance
          path: |
            reports/banking-api-performance.json
            reports/banking-api-performance.xml
          if-no-files-found: error

      - name: Validar as evidências e resumir o JUnit
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: |
          python .github/scripts/validar_junit.py reports/banking-api-junit.xml reports/banking-api-performance.xml
          test -s reports/banking-api-performance.json

  quality-gate:
    name: Quality Gate da API
    needs: api-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conferir resultado da validação
        env:
          RESULTADO: ${{ needs.api-tests.result }}
        run: |
          if [ "$RESULTADO" != "success" ]; then
            echo "::error::Validação da API bancária terminou com status $RESULTADO."
            exit 1
          fi
